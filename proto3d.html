<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3D 시점 맛보기</title>
<style>
html,body{margin:0;height:100%;background:#0b1a2e;overflow:hidden;font-family:system-ui,sans-serif}
canvas{width:100%;height:100%;display:block}
.bar{position:fixed;left:0;right:0;top:0;display:flex;gap:6px;padding:8px;flex-wrap:wrap;z-index:2}
.bar button{flex:1;min-width:0;padding:9px 4px;border:0;border-radius:9px;background:rgba(10,20,36,.72);color:#dfe8f4;font-weight:700;font-size:13px}
.bar button.on{background:#f1c40f;color:#1a1a1a}
.note{position:fixed;left:8px;right:8px;bottom:8px;color:#fff;font-size:12px;text-shadow:0 1px 2px #000;z-index:2;pointer-events:none}
</style>
</head>
<body>
<div class="bar">
  <button data-v="pitcher" class="on">투구 시점</button>
  <button data-v="catcher">타격 시점</button>
  <button id="d2">2D(지금)</button>
</div>
<canvas id="cv"></canvas>
<div class="note" id="note"></div>
<script type="module">
// 맛보기(버릴 코드): 타구 장면의 3D 경기장을 투구·타격 시점 카메라로 비추고, 지금 쓰는 투수·타자 그림과 3D로 날아오는 공을 올린다.
// 좌표(피트): x = 1루 쪽 +, y = 홈 → 중견수 +, z = 위. 홈플레이트 가운데 = 원점
import { getTeam } from './js/data/rosters.js';
import { uniformFor } from './js/ui/art/uniforms.js';
import { makeCamera, project, drawStadium3D } from './js/ui/art/field3d.js';
import { drawPitcherSprite, drawBatterSprite, drawCatcherSprite, spriteReleaseOffset, SWING_CONTACT_MS } from './js/ui/art/sprites.js';
import { drawBall } from './js/ui/art/figures.js';
import { pitchPath, makeView, ballScreen, toS, pitcherAnchor, batterAnchor, setReleaseOverride } from './js/ui/art/view.js';
import { buildBackdrop, standsImage } from './js/ui/art/stadium.js';
import { ZONE_K, BALL_R } from './js/core/pitch.js';

const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let W, H, dpr;
function resize() { dpr = window.devicePixelRatio || 1; W = innerWidth; H = innerHeight; cv.width = W * dpr; cv.height = H * dpr; bg = {}; }
let bg = {};
addEventListener('resize', resize); resize();

const sam = getTeam('samsung'), lg = getTeam('lg');
const pitcher = sam.pitchers[0], uP = uniformFor(sam, 'home'), uB = uniformFor(lg, 'away');
let view = 'pitcher', d2 = false;

// 존 좌표 → 피트: 존 가로 끝(±ZONE_K) = 홈플레이트 끝(±0.708피트), 세로는 지금 화면처럼 가로의 1.2배
const XU = 0.708 / ZONE_K, YU = XU * 1.2, ZC = 2.5;
const plateW = (x, y) => [x * XU, 0, ZC + y * YU];
const STAND_FT = 6.2;                       // 그림 속 선 키(182 포즈 단위) = 6.2피트
const RAW = 182;

// 카메라: 지금 화면과 존 크기·위치를 맞춘다. 사람은 실제 크기면 너무 커서(망원) 홈 근처 사람만 줄인다
function camera(kind) {
  if (kind === 'catcher') {                 // 포수 뒤 32피트, 눈높이보다 조금 위에서 마운드 쪽
    const C = [0, -32, 6.2], T = [0, 30, 3.2];
    const K = makeCamera(C, T, 1, W, H);
    const d = 32;                           // 존까지 거리
    K.F = Math.min(W * 0.36, H * 0.24) * ZONE_K * d / (2 * 0.708);
    K.cy = H * 0.5;
    const z = project(K, [0, 0, ZC]); K.cy += H * 0.6 - z.y;   // 존 가운데를 화면 0.6 높이에
    return { K, plateK: 0.72, batX: 2.0 };
  }
  const C = [0, 60.5 + 24, 10], T = [0, 0, 3];  // 투수 뒤 24피트, 조금 높이서 홈 쪽
  const K = makeCamera(C, T, 1, W, H);
  K.F = Math.min(W * 0.33, H * 0.21) * ZONE_K * 84.5 / (2 * 0.708);
  const z = project(K, [0, 0, ZC]); K.cy += H * 0.36 - z.y;
  return { K, plateK: 0.62, batX: 2.0 };
}
// 화면 점(sx, sy)을 지나는 시선이 y = yT 평면과 만나는 3D 점
function unproject(K, sx, sy, yT) {
  const X = (sx - K.cx) / K.F, Y = (K.cy - sy) / K.F;
  const dir = [K.r[0] * X + K.u[0] * Y + K.f[0], K.r[1] * X + K.u[1] * Y + K.f[1], K.r[2] * X + K.u[2] * Y + K.f[2]];
  const t = (yT - K.C[1]) / dir[1];
  return [K.C[0] + dir[0] * t, K.C[1] + dir[1] * t, K.C[2] + dir[2] * t];
}

// 공: 손 → 홈플레이트 3D 경로(구종별로 휘는 것은 지금과 같은 값, 피트로 바꿔서)
const TYPES = pitcher.pitches;
let ball = null, cycle = 0;
function newPitch(now) {
  const type = TYPES[cycle++ % TYPES.length];
  const target = { x: (Math.random() * 2 - 1) * 0.9, y: (Math.random() * 2 - 1) * 0.9 };
  const speed = { FB: 1, SL: 0.88, CH: 0.85, CU: 0.8 }[type] || 0.9;
  const travelMs = 430 / speed;
  ball = { pitch: { type, throws: pitcher.throws, plate: target, travelMs, breakX: 0, breakY: 0 }, start: now + 1050, swing: Math.random() < 0.5 };
}
function ballWorld(R, pitch, p) {
  const br = pitchPath(pitch), m = 1.2;
  const P = plateW(pitch.plate.x, pitch.plate.y), B = [br.x * m * XU, 0, br.y * m * YU];
  const pp = Math.min(p, 1), late = Math.pow(pp, br.n);
  const out = [0, 1, 2].map(i => R[i] + (P[i] - B[i] - R[i]) * pp + B[i] * late);
  if (p > 1) out[1] = -(p - 1) * 55;        // 지나간 뒤 포수 쪽으로
  return out;
}

// 투구 시점: 홈 뒤 60피트에 백스톱 벽 + 관중(지금 쓰는 구장 사진)을 세운다. 망원이라 보이는 폭이 좁아서 화면 폭에 맞춘다
function backstop(x, K) {
  const img = standsImage('pitcher'), Y = -60;
  const a = project(K, [0, Y, 0]); if (!a) return;
  const wFt = W / a.s * 1.15, hFt = img ? wFt * img.height / img.width : 8;
  const tl = project(K, [wFt / 2, Y, hFt]), br = project(K, [-wFt / 2, Y, 0]);
  if (img) x.drawImage(img, tl.x, tl.y, br.x - tl.x, br.y - tl.y);
  else { x.fillStyle = '#1d2a44'; x.fillRect(tl.x, tl.y, br.x - tl.x, br.y - tl.y); }
  x.fillStyle = '#1d2a44'; x.fillRect(0, 0, W, Math.max(0, tl.y + 1));   // 사진 위(하늘 쪽)는 어둡게 채운다
}
function drawZone(K, alpha) {
  const c = [[-0.708, ZC + ZONE_K * YU], [0.708, ZC + ZONE_K * YU], [0.708, ZC - ZONE_K * YU], [-0.708, ZC - ZONE_K * YU]].map(([x, z]) => project(K, [x, 0, z]));
  ctx.save(); ctx.strokeStyle = `rgba(255,255,255,${alpha})`; ctx.lineWidth = 2;
  ctx.beginPath(); c.forEach((q, i) => i ? ctx.lineTo(q.x, q.y) : ctx.moveTo(q.x, q.y)); ctx.closePath(); ctx.stroke();
  ctx.restore();
}

function frame3D(now) {
  const { K, plateK, batX } = camera(view);
  // 배경은 카메라가 그대로면 한 번만 그려 둔다
  if (!bg[view] || !bg[view].done) {
    const c = bg[view]?.c || document.createElement('canvas'); c.width = W * dpr; c.height = H * dpr;
    const x = c.getContext('2d'); x.setTransform(dpr, 0, 0, dpr, 0, 0); drawStadium3D(x, K);
    if (view === 'pitcher') backstop(x, K);
    bg[view] = { c, done: now > 6000 };      // 관중석 그림이 늦게 오면 다시 그린다
  }
  ctx.drawImage(bg[view].c, 0, 0, W, H);
  const front = view === 'catcher';
  const R = pitcher.throws === 'L' ? 'L' : 'R';
  // 투수
  let pArgs;
  if (front) {
    const f = project(K, [0, 60.5, 0.8]);
    pArgs = { x: f.x, y: f.y, scale: f.s * STAND_FT / RAW };
  } else {
    pArgs = { x: W * 0.5, y: H * 1.13, scale: H * 0.56 / 180 };   // 카메라 바로 앞이라 지금처럼 크게(실제 크기로는 화면을 넘는다)
  }
  pArgs = { ...pArgs, back: !front, uni: uP, player: pitcher, throws: R, now, releaseAt: ball ? ball.start : null, windMs: 1050 };
  // 손 위치 → 3D 릴리스 점(마운드 앞 5.5피트 평면)
  const off = spriteReleaseOffset(!front, R) || [0, -170];
  const hand = [pArgs.x + off[0] * pArgs.scale * (front ? 1 : 1), pArgs.y + off[1] * pArgs.scale];
  const rel = unproject(K, hand[0], hand[1], 55);
  // 타자(우타자는 3루 쪽 = x < 0)
  const side = -1, bw = project(K, [side * batX, 0, 0]);
  const bArgs = { x: bw.x, y: bw.y, scale: bw.s * STAND_FT / RAW * plateK, facing: (front ? 1 : -1) * -side, uni: uB, now,
    swingAt: ball && ball.swing ? ball.start + ball.pitch.travelMs - SWING_CONTACT_MS : null, pitchStart: ball ? ball.start : null, travelMs: ball ? ball.pitch.travelMs : 1, front: !front };
  // 공
  let bp = null;
  if (ball && now >= ball.start) {
    const p = (now - ball.start) / ball.pitch.travelMs;
    if (p <= 1.06) { const w = ballWorld(rel, ball.pitch, p), q = project(K, w); if (q) bp = { x: q.x, y: q.y, r: Math.max(2.2, q.s * BALL_R * XU), spin: (now - ball.start) / 25 }; }
  }
  if (front) {
    drawPitcherSprite(ctx, pArgs);
    drawZone(K, 0.32);
    if (bp) drawBall(ctx, bp.x, bp.y, bp.r, bp.spin);
    drawBatterSprite(ctx, bArgs);
  } else {
    // 포수·심판: 지금 그리는 함수에 3D로 구한 자리·크기를 넘긴다
    const cf = project(K, [0, -2.6, 0]), zh = 3.9 * STAND_FT / 6.2 * cf.s * plateK / 0.86;
    drawCatcherSprite(ctx, { feetY: cf.y + zh * 0.05, zh, zw: zh / 1.2, cx: cf.x, figH: zh * 1.35, mirror: true }, null, now);
    drawZone(K, 0.7);
    drawBatterSprite(ctx, bArgs);
    if (bp) drawBall(ctx, bp.x, bp.y, bp.r, bp.spin);
    drawPitcherSprite(ctx, pArgs);
  }
  return ball ? ball.pitch.type : '';
}

// 비교용: 지금 쓰는 2D 화면(같은 공)
function frame2D(now) {
  const V = makeView(view, W, H);
  if (!bg['2d' + view]) bg['2d' + view] = buildBackdrop(view, V, W, H, dpr, sam);
  ctx.drawImage(bg['2d' + view], 0, 0, W, H);
  const pa = pitcherAnchor(V, 'R'), ba = batterAnchor(V, 'R');
  setReleaseOverride((back, t) => spriteReleaseOffset(back, t));
  const pArgs = { ...pa, uni: uP, player: pitcher, throws: 'R', now, releaseAt: ball ? ball.start : null, windMs: 1050 };
  const bArgs = { ...ba, uni: uB, now, swingAt: ball && ball.swing ? ball.start + ball.pitch.travelMs - SWING_CONTACT_MS : null, pitchStart: ball ? ball.start : null, travelMs: ball ? ball.pitch.travelMs : 1, front: view === 'pitcher' };
  const bp = ball && now >= ball.start ? ballScreen(V, ball.pitch, ball.start, now) : null;
  const zone = a => { const [x0, y0] = toS(V, (V.mirror ? 1 : -1) * ZONE_K, ZONE_K); ctx.strokeStyle = `rgba(255,255,255,${a})`; ctx.lineWidth = 2; ctx.strokeRect(x0, y0, V.zw * ZONE_K, V.zh * ZONE_K); };
  if (view === 'pitcher') {
    drawCatcherSprite(ctx, V, null, now); zone(0.7); drawBatterSprite(ctx, bArgs);
    if (bp && bp.prog <= 1.02) drawBall(ctx, bp.x, bp.y, bp.r, bp.spin);
    drawPitcherSprite(ctx, pArgs);
  } else {
    drawPitcherSprite(ctx, pArgs); zone(0.32);
    if (bp && bp.prog <= 1.02) drawBall(ctx, bp.x, bp.y, bp.r, bp.spin);
    drawBatterSprite(ctx, bArgs);
  }
}

const NAMES = { FB: '직구', SL: '슬라이더', CH: '체인지업', CU: '커브', SI: '투심', CT: '커터', FO: '포크' };
const AT = new URLSearchParams(location.search).get('at');   // 확인용: ?at=0.7 → 같은 공의 70% 지점에서 멈춘 화면
function loop(now) {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (AT != null) {
    if (!ball) { newPitch(0); ball.pitch.type = 'SL'; ball.pitch.plate = { x: 0.5, y: -0.4 }; ball.swing = false; }
    now = ball.start + +AT * ball.pitch.travelMs + (now > 9000 ? 0 : now - 9000) * 0;
  } else if (!ball || now > ball.start + ball.pitch.travelMs + 1300) newPitch(now);
  if (d2) frame2D(now); else frame3D(now);
  document.getElementById('note').textContent = `${d2 ? '2D(지금 게임)' : '3D 맛보기'} · ${NAMES[ball.pitch.type] || ''} · 공은 2~3초마다 자동으로 던져요`;
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

document.querySelectorAll('[data-v]').forEach(b => b.onclick = () => {
  view = b.dataset.v; document.querySelectorAll('[data-v]').forEach(x => x.classList.toggle('on', x === b));
});
document.getElementById('d2').onclick = e => { d2 = !d2; e.target.classList.toggle('on', d2); };
if (location.hash === '#catcher') { view = 'catcher'; document.querySelectorAll('[data-v]').forEach(x => x.classList.toggle('on', x.dataset.v === 'catcher')); }
if (location.search.includes('2d')) { d2 = true; document.getElementById('d2').classList.add('on'); }
</script>
</body>
</html>
