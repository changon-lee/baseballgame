<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3D 투수 맛보기</title>
<style>
html,body{margin:0;height:100%;background:#0b1a2e;overflow:hidden;font-family:system-ui,sans-serif;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.bar{position:fixed;left:0;right:0;top:0;display:flex;gap:6px;padding:8px;z-index:2}
.bar button{flex:1;min-width:0;padding:9px 4px;border:0;border-radius:9px;background:rgba(10,20,36,.72);color:#dfe8f4;font-weight:700;font-size:13px}
.bar button.on{background:#f1c40f;color:#1a1a1a}
.note{position:fixed;left:8px;right:8px;bottom:8px;color:#fff;font-size:12px;text-shadow:0 1px 2px #000;z-index:2;pointer-events:none}
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
</head>
<body>
<canvas id="bg"></canvas>
<canvas id="gl"></canvas>
<div class="bar">
  <button data-cam="pitcher" class="on">투구 시점</button>
  <button data-cam="catcher">타격 시점</button>
  <button data-cam="side">옆에서</button>
</div>
<div class="note" id="note">불러오는 중…</div>
<script type="module">
// 맛보기(버릴 코드): Mixamo 투구 동작(3D 마네킹)을 3D 구장 위에 세운다.
// 구장은 타구 장면 코드(캔버스)로 같은 카메라에서 그리고, 그 위에 투명한 WebGL 화면으로 선수·공·그림자를 겹친다.
// 좌표(피트): x = 1루 쪽 +, y = 홈 → 중견수 +, z = 위. 홈플레이트 가운데 = 원점
import * as THREE from 'three';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { makeCamera, drawStadium3D } from './js/ui/art/field3d.js';

const bgc = document.getElementById('bg'), bctx = bgc.getContext('2d');
const glc = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas: glc, alpha: true, antialias: true });
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(30, 1, 1, 3000); cam.up.set(0, 0, 1);
scene.add(new THREE.HemisphereLight(0xdfeeff, 0x4a6b3a, 1.3));
const sun = new THREE.DirectionalLight(0xffffff, 2.2); sun.position.set(-60, 120, 160); sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024); Object.assign(sun.shadow.camera, { left: -15, right: 15, top: 15, bottom: -15, near: 50, far: 400 });
sun.target.position.set(0, 58, 0); scene.add(sun, sun.target);
// 그림자만 받는 투명 바닥(구장 그림 위에 그림자만 얹힌다)
const ground = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.ShadowMaterial({ opacity: 0.32 }));
ground.position.set(0, 55, 0.02); ground.receiveShadow = true; scene.add(ground);

// 카메라 자리: [카메라 위치, 바라보는 곳, 세로 시야각]
const CAMS = {
  pitcher: { C: [1.5, 60.5 + 42, 13], T: [0, 0, 3.5], fov: 21 },
  catcher: { C: [0, -30, 6], T: [0, 50, 4], fov: 26 },
  side:    { C: [-45, 40, 14], T: [0, 56, 3.5], fov: 30 },
};
let camFrom = CAMS.pitcher, camTo = CAMS.pitcher, camT0 = 0, yaw = 0, drag = null;
const lerp = (a, b, t) => a + (b - a) * t, mix3 = (a, b, t) => a.map((v, i) => lerp(v, b[i], t));
function camAt(now) {
  const k = Math.min(1, (now - camT0) / 900), s = k * k * (3 - 2 * k);
  const C0 = mix3(camFrom.C, camTo.C, s), T = mix3(camFrom.T, camTo.T, s), fov = lerp(camFrom.fov, camTo.fov, s);
  // 손가락으로 끌면 바라보는 곳을 중심으로 돈다
  const dx = C0[0] - T[0], dy = C0[1] - T[1], c = Math.cos(yaw), sn = Math.sin(yaw);
  return { C: [T[0] + dx * c - dy * sn, T[1] + dx * sn + dy * c, C0[2]], T, fov };
}

// 선수: Mixamo 마네킹(Beta_Surface = 몸, Beta_Joints = 관절)에 팀 색을 입힌다
const mixers = [];
let pitcher = null, hand = null, clip = null, action = null, releaseT = 0;
new FBXLoader().load('assets/models/pitching.fbx', fbx => {
  fbx.traverse(o => {
    if (o.isMesh) {
      o.castShadow = true;
      const mats = Array.isArray(o.material) ? o.material : [o.material];
      mats.forEach(m => { m.color && m.color.set(/Joint/i.test(m.name) ? 0x1d4ea1 : 0xf3f3f0); m.shininess = 12; });
    }
    if (/RightHand$/.test(o.name)) hand = o;
  });
  // Mixamo는 센티미터·Y가 위 → 피트·Z가 위로. 앞(+Z)은 홈 쪽(-y)을 보게 된다
  const holder = new THREE.Group();
  fbx.scale.setScalar(1 / 30.48); fbx.rotation.x = Math.PI / 2;
  holder.add(fbx); holder.position.set(0, 60.5, 0); scene.add(holder);
  pitcher = holder;
  const mixer = new THREE.AnimationMixer(fbx); mixers.push(mixer);
  clip = fbx.animations[0]; action = mixer.clipAction(clip); action.setLoop(THREE.LoopOnce); action.clampWhenFinished = true;
  // 공을 놓는 순간 = 손이 가장 빨리 홈 쪽으로 움직이는 때
  action.play(); let best = -1, prev = null; const v = new THREE.Vector3();
  for (let t = 0; t <= clip.duration; t += 1 / 60) {
    mixer.setTime(t); holder.updateMatrixWorld(true); hand.getWorldPosition(v);
    if (prev != null) { const sp = prev - v.y; if (sp > best) { best = sp; releaseT = t; } }
    prev = v.y;
  }
  mixer.setTime(0);
  new GLTFLoader().load('assets/models/player.glb', g => { try { reskin(fbx, g.scene); } catch (e) { console.error(e); } startPitch(performance.now()); },
    undefined, () => startPitch(performance.now()));
  window.__info = { duration: clip.duration, releaseT, tracks: clip.tracks.length };
  document.getElementById('note').textContent = `Mixamo 투구 동작 · 손가락으로 좌우로 끌면 카메라가 돌아요`;
}, undefined, e => { document.getElementById('note').textContent = '3D 모델을 못 불러왔어요: ' + (e.message || e); });

// ── 사진으로 만든 3D 선수(움직이는 뼈가 없는 모양만)를 마네킹 뼈대에 붙인다 ──
// 둘 다 T자 자세라, 크기·위치를 맞춘 뒤 선수 모양의 점마다 가장 가까운 마네킹 점들의 '어느 뼈를 따라 움직이는지'를 옮겨 받는다.
// 색: 사진 모델엔 색이 없어서 뼈·높이로 유니폼(모자·상의·벨트·바지·양말·신발)과 피부를 나눠 칠한다
const UNI = { cap: 0x1d4ea1, jersey: 0xf2f2ee, belt: 0x1d4ea1, pants: 0xf2f2ee, socks: 0x1d4ea1, shoes: 0x1b1b1f, skin: 0xe9bc98 };
function reskin(fbx, glbRoot) {
  let surf = null; fbx.traverse(o => { if (o.isSkinnedMesh && (!surf || /Surface/.test(o.name))) surf = o; });
  let gmesh = null; glbRoot.traverse(o => { if (o.isMesh && !gmesh) gmesh = o; });
  const sk = surf.skeleton;
  sk.pose(); fbx.parent.updateMatrixWorld(true);
  const toLocal = new THREE.Matrix4().copy(fbx.matrixWorld).invert();
  // 마네킹 점(마네킹 자신의 좌표: Y가 위, +Z가 앞, cm)과 뼈 정보
  const sp = surf.geometry.attributes.position, si = surf.geometry.attributes.skinIndex, sw = surf.geometry.attributes.skinWeight;
  const N = sp.count, src = new Float32Array(N * 3), v = new THREE.Vector3();
  const mb = new THREE.Box3();
  for (let i = 0; i < N; i++) { surf.getVertexPosition(i, v); v.applyMatrix4(surf.matrixWorld).applyMatrix4(toLocal); src.set([v.x, v.y, v.z], i * 3); mb.expandByPoint(v); }
  // 선수 모양을 마네킹 크기·자리에 맞춘다(키 기준, 발바닥·가운데 맞춤)
  const g = gmesh.geometry.clone(); g.applyMatrix4(gmesh.matrixWorld);
  g.computeBoundingBox(); const gb = g.boundingBox;
  const s = (mb.max.y - mb.min.y) / (gb.max.y - gb.min.y);
  const gp = g.attributes.position, M = gp.count;
  const gc = new THREE.Vector3(); gb.getCenter(gc); const mc = new THREE.Vector3(); mb.getCenter(mc);
  const loc = new Float32Array(M * 3);
  for (let i = 0; i < M; i++) {
    loc[i * 3] = (gp.getX(i) - gc.x) * s + mc.x; loc[i * 3 + 1] = (gp.getY(i) - gb.min.y) * s + mb.min.y; loc[i * 3 + 2] = (gp.getZ(i) - gc.z) * s + mc.z;
  }
  // 가까운 점 찾기용 격자
  const CELL = 6, grid = new Map(), key = (x, y, z) => x + ',' + y + ',' + z, cellOf = c => Math.floor(c / CELL);
  for (let i = 0; i < N; i++) { const k = key(cellOf(src[i * 3]), cellOf(src[i * 3 + 1]), cellOf(src[i * 3 + 2])); let a = grid.get(k); if (!a) grid.set(k, a = []); a.push(i); }
  const H = mb.max.y - mb.min.y, bones = sk.bones;
  const bonePos = bones.map(b => { const w = new THREE.Vector3(); b.getWorldPosition(w); return w.applyMatrix4(toLocal); });
  const boneIdx = n => bones.findIndex(b => b.name.endsWith(n));
  const skinIndex = new Uint16Array(M * 4), skinWeight = new Float32Array(M * 4), colors = new Float32Array(M * 3), col = new THREE.Color();
  for (let i = 0; i < M; i++) {
    const x = loc[i * 3], y = loc[i * 3 + 1], z = loc[i * 3 + 2], cx = cellOf(x), cy = cellOf(y), cz = cellOf(z);
    let best = [];
    for (let r = 1; r <= 6 && best.length < 4; r++) {
      best = [];
      for (let a = -r; a <= r; a++) for (let b = -r; b <= r; b++) for (let c = -r; c <= r; c++) {
        const list = grid.get(key(cx + a, cy + b, cz + c)); if (!list) continue;
        for (const j of list) { const dx = src[j * 3] - x, dy = src[j * 3 + 1] - y, dz = src[j * 3 + 2] - z; best.push([dx * dx + dy * dy + dz * dz, j]); }
      }
    }
    best.sort((p, q) => p[0] - q[0]); best = best.slice(0, 4);
    const acc = new Map();
    for (const [d2, j] of best) { const w0 = 1 / (Math.sqrt(d2) + 0.5); for (let k = 0; k < 4; k++) { const bw = sw.getComponent(j, k); if (bw > 0) { const bi = si.getComponent(j, k); acc.set(bi, (acc.get(bi) || 0) + bw * w0); } } }
    const top = [...acc].sort((p, q) => q[1] - p[1]).slice(0, 4), tot = top.reduce((t, e) => t + e[1], 0) || 1;
    top.forEach(([bi, w], k) => { skinIndex[i * 4 + k] = bi; skinWeight[i * 4 + k] = w / tot; });
    // 색
    const name = top.length ? bones[top[0][0]].name : '', h = (y - mb.min.y) / H;
    let part;
    if (/Hand|ForeArm/.test(name)) part = 'skin';
    else if (/(Left|Right)Arm$/.test(name)) {
      const a = bonePos[top[0][0]], e = bonePos[boneIdx(name.replace('Arm', 'ForeArm'))];
      const t = e ? ((x - a.x) * (e.x - a.x) + (y - a.y) * (e.y - a.y) + (z - a.z) * (e.z - a.z)) / a.distanceToSquared(e) : 0;
      part = t < 0.55 ? 'jersey' : 'skin';
    }
    else if (/Shoulder|Spine/.test(name) && h < 0.86) part = 'jersey';      // 어깨 위쪽이 목 높이라 피부로 칠해지던 것
    else part = h > 0.935 ? 'cap' : h > 0.835 ? 'skin' : h > 0.595 ? 'jersey' : h > 0.575 ? 'belt' : h > 0.25 ? 'pants' : h > 0.085 ? 'socks' : 'shoes';
    col.setHex(UNI[part]).convertSRGBToLinear(); colors.set([col.r, col.g, col.b], i * 3);
  }
  // 마네킹 메시 좌표로 옮겨 같은 뼈대에 묶는다
  const back = new THREE.Matrix4().copy(surf.matrixWorld).invert().multiply(fbx.matrixWorld);
  for (let i = 0; i < M; i++) { v.set(loc[i * 3], loc[i * 3 + 1], loc[i * 3 + 2]).applyMatrix4(back); gp.setXYZ(i, v.x, v.y, v.z); }
  g.setAttribute('skinIndex', new THREE.Uint16BufferAttribute(skinIndex, 4));
  g.setAttribute('skinWeight', new THREE.Float32BufferAttribute(skinWeight, 4));
  g.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  g.computeVertexNormals();
  const mesh = new THREE.SkinnedMesh(g, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.75 }));
  mesh.castShadow = true; mesh.frustumCulled = false;
  surf.parent.add(mesh); mesh.position.copy(surf.position); mesh.quaternion.copy(surf.quaternion); mesh.scale.copy(surf.scale);
  mesh.updateMatrixWorld(true);
  mesh.bind(sk, surf.bindMatrix);
  fbx.traverse(o => { if (o.isSkinnedMesh && o !== mesh) o.visible = false; });
  window.__reskin = { verts: M, src: N };
}

// 공
const ball = new THREE.Mesh(new THREE.SphereGeometry(0.16, 16, 12), new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.5 }));
ball.castShadow = true; ball.visible = false; scene.add(ball);
// 홈 뒤 백스톱 + 관중(구장 사진). 투구 시점에서 홈 뒤 관중석이 너무 멀어 흐릿해서 60피트 뒤에 사진을 세운다
new THREE.TextureLoader().load('assets/stadium/pitcher.webp', tex => {
  tex.colorSpace = THREE.SRGBColorSpace;
  const w = 170, h = w * tex.image.height / tex.image.width;
  const wall = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map: tex }));
  wall.position.set(0, -62, h / 2); wall.up.set(0, 0, 1); wall.lookAt(0, 100, h / 2); scene.add(wall);
});
// 스트라이크 존
const zone = new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints([[-0.71, 3.4], [0.71, 3.4], [0.71, 1.6], [-0.71, 1.6]].map(([x, z]) => new THREE.Vector3(x, 0, z))),
  new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.6 }));
scene.add(zone);

let p0 = 0, rel = null, target = null;
const TRAVEL = 0.45;                          // 초(약 140km/h)
function startPitch(now) {
  p0 = now; rel = null; target = new THREE.Vector3((Math.random() - 0.5) * 1.6, 0, 1.8 + Math.random() * 1.5);
  action.reset().play();
}

let lastKey = '';
function resize() {
  const W = innerWidth, H = innerHeight, d = Math.min(2, devicePixelRatio || 1);
  bgc.width = W * d; bgc.height = H * d; renderer.setPixelRatio(d); renderer.setSize(W, H, false);
  cam.aspect = W / H; cam.updateProjectionMatrix(); lastKey = '';
}
addEventListener('resize', resize); resize();

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const W = innerWidth, H = innerHeight, d = Math.min(2, devicePixelRatio || 1);
  const c = camAt(now);
  cam.fov = c.fov; cam.updateProjectionMatrix(); cam.position.set(...c.C); cam.lookAt(...c.T);
  // 구장(캔버스): 같은 카메라. 카메라가 그대로면 다시 그리지 않는다(관중석 그림이 늦게 오면 몇 초 뒤 한 번 더)
  const key = c.C.map(v => v.toFixed(2)).join() + c.fov.toFixed(2) + W + H + Math.min(3, Math.floor(now / 2500));
  if (key !== lastKey) {
    lastKey = key;
    const F = H / 2 / Math.tan(c.fov * Math.PI / 360);
    bctx.setTransform(d, 0, 0, d, 0, 0); drawStadium3D(bctx, makeCamera(c.C, c.T, F, W, H));
  }
  mixers.forEach(m => m.update(dt));
  if (pitcher && hand) {
    const t = action.time, v = new THREE.Vector3();
    if (rel == null && t < releaseT) { hand.getWorldPosition(v); ball.position.copy(v); ball.visible = true; }
    else {
      if (rel == null) { hand.getWorldPosition(v); rel = { at: now, from: v.clone() }; }
      const p = (now - rel.at) / 1000 / TRAVEL, pp = Math.min(p, 1);
      if (p <= 1.15) {
        const q = rel.from.clone().lerp(target, pp);
        q.z += 0.9 * pp * (1 - pp);                // 살짝 떠 보이다 가라앉는 길
        if (p > 1) q.y = -(p - 1) * 60;
        ball.position.copy(q); ball.visible = true;
      } else ball.visible = false;
    }
    if (now - p0 > clip.duration * 1000 + 1200) startPitch(now);
  }
  renderer.render(scene, cam);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

const pick = name => { const b = document.querySelector(`[data-cam=${name}]`); document.querySelectorAll('[data-cam]').forEach(x => x.classList.toggle('on', x === b)); };
document.querySelectorAll('[data-cam]').forEach(b => b.onclick = () => {
  const now = performance.now(); camFrom = camAt(now); yaw = 0; camTo = CAMS[b.dataset.cam]; camT0 = now; pick(b.dataset.cam);
});
glc.addEventListener('pointerdown', e => { drag = { x: e.clientX, yaw }; });
addEventListener('pointermove', e => { if (drag) yaw = drag.yaw - (e.clientX - drag.x) / innerWidth * 2.2; });
addEventListener('pointerup', () => { drag = null; });
if (CAMS[location.hash.slice(1)]) { camFrom = camTo = CAMS[location.hash.slice(1)]; pick(location.hash.slice(1)); }
// 확인용: 동작을 t초에 멈춘다
window.__seek = t => { if (action) { action.paused = true; action.time = t; mixers[0].update(0); return window.__info; } };
</script>
</body>
</html>
