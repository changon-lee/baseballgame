<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>야구 스파이크</title>
<style>
:root{--blue:#074CA1;--bg:#0b1a2e;--fg:#fff;--dim:#9fb3cc;--green:#2ecc71;--red:#e74c3c;--yellow:#f1c40f}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overflow:hidden}
#app{display:flex;flex-direction:column;height:100%;max-width:520px;margin:0 auto}
#board{padding:calc(6px + env(safe-area-inset-top)) 12px 6px;background:#06101d;font-size:14px}
#board .top{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:18px}
#board .sub{display:flex;justify-content:space-between;color:var(--dim);margin-top:4px;font-size:13px}
.dots span{display:inline-block;width:9px;height:9px;border-radius:50%;background:#2a3b52;margin-left:3px}
.dots .b.on{background:var(--green)}.dots .s.on{background:var(--yellow)}.dots .o.on{background:var(--red)}
#stage{flex:1;position:relative;min-height:0}
canvas{width:100%;height:100%;display:block}
#controls{min-height:132px;padding:8px 12px calc(10px + env(safe-area-inset-bottom));box-sizing:border-box;background:#06101d}
#controls p{margin:4px 0 8px;color:var(--dim);font-size:14px;text-align:center}
button{min-height:48px;font-size:16px;border:0;border-radius:10px;background:var(--blue);color:#fff;padding:0 14px;font-weight:700;font-family:inherit}
button.ghost{background:#22344d}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.row button{flex:1 1 30%}
.list button{display:block;width:100%;margin-bottom:6px;text-align:left}
#overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(6,16,29,.92);text-align:center;padding:16px}
#overlay h1{margin:0;font-size:28px}
#overlay .tag{color:var(--yellow);font-size:13px}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="app">
  <div id="board">
    <div class="top"><span id="sc">LG 0 : 0 삼성</span><span id="inn">1회초</span></div>
    <div class="sub"><span id="mu"></span><span class="dots" id="bso"></span></div>
  </div>
  <div id="stage"><canvas id="cv"></canvas>
    <div id="overlay">
      <div class="tag">스파이크 버전 3 · 손맛 테스트용</div>
      <h1>삼성 라이온즈 vs LG 트윈스</h1>
      <p style="color:var(--dim);margin:0">삼성이 홈팀 · 초에는 내가 투수, 말에는 내가 타자</p>
      <div class="row" style="width:100%;max-width:320px">
        <button data-inn="1">1이닝</button><button data-inn="3">3이닝</button><button data-inn="9">9이닝</button>
      </div>
    </div>
  </div>
  <div id="controls"></div>
</div>
<script>
'use strict';
// ───────── 기본 도구 ─────────
const $ = s => document.querySelector(s);
const rnd = Math.random;
const randN = () => { let u = 0, v = 0; while (!u) u = rnd(); while (!v) v = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const SPEED_SCALE = 1.6;      // 공 속도 배율(클수록 느림)
const GAUGE_PERIOD = 900;     // 게이지 왕복 시간(ms), 지치면 더 빨라짐
const AIM_LIFT = 60;          // 조준점을 손가락 위로 띄우는 거리(px)
const WIND_CPU = 800, WIND_USER = 550;   // 와인드업 시간(ms)
const BALL_R = 0.17;          // 공 반지름(존 가로 반폭 기준) — 존에 걸치면 스트라이크

const PT = {
  FB:{n:'직구',m:1.00,bx:0,by:.10}, SI:{n:'투심',m:.97,bx:.25,by:-.15}, CT:{n:'커터',m:.94,bx:-.20,by:0},
  SL:{n:'슬라이더',m:.88,bx:-.45,by:-.15}, CU:{n:'커브',m:.80,bx:-.20,by:-.60},
  CH:{n:'체인지업',m:.85,bx:.25,by:-.35}, FO:{n:'포크',m:.86,bx:0,by:-.55},
};

// ───────── 선수 (스파이크용 일부, 능력치는 대략) ─────────
const B = (name,num,pos,bats,power,contact,eye) => ({name,num,pos,bats,power,contact,eye});
const P = (name,num,throws,role,velo,control,stamina,pitches) => ({name,num,throws,role,velo,control,stamina,pitches});
const SAM = { name:'삼성', color:'#074CA1', batters:[
  B('김지찬',58,'CF','L',25,78,72), B('김성윤',39,'RF','L',35,75,60), B('구자욱',5,'LF','L',72,85,70), B('디아즈',43,'1B','L',92,68,55),
  B('김영웅',30,'3B','L',80,60,50), B('강민호',47,'C','R',62,66,60), B('이재현',7,'SS','R',60,62,58), B('류지혁',16,'2B','L',35,70,65), B('이성규',13,'DH','R',65,55,45)],
  pitchers:[ P('원태인',18,'R','SP',150,82,88,['FB','SL','CH','CU']), P('김재윤',62,'R','RP',147,70,35,['FB','FO','SL']),
  P('배찬승',55,'L','RP',153,55,30,['FB','SL']), P('이승현',57,'L','RP',144,68,35,['FB','SL','CU'])] };
const LG = { name:'LG', color:'#c30452', batters:[
  B('홍창기',51,'RF','L',35,82,90), B('신민재',4,'2B','L',25,78,70), B('오스틴',23,'1B','R',85,75,65), B('문보경',2,'3B','L',72,72,68),
  B('문성주',8,'LF','L',30,80,72), B('오지환',10,'SS','L',58,60,60), B('박동원',27,'C','R',75,58,55), B('박해민',17,'CF','L',30,68,60), B('구본혁',6,'DH','R',35,60,55)],
  pitchers:[ P('임찬규',1,'R','SP',143,80,85,['FB','CU','CH','SL']), P('유영찬',54,'R','RP',152,62,35,['FB','SL','FO']),
  P('김진성',42,'R','RP',145,70,30,['FB','FO','SL'])] };
const TEAM = { home:SAM, away:LG };
const UNI = {
  home: { jersey:'#f6f8fb', jerseyD:'#cdd5e1', trim:'#074CA1', pants:'#f6f8fb', pantsD:'#c9d0db', cap:'#074CA1', sock:'#074CA1', glove:'#074CA1' },
  away: { jersey:'#868c95', jerseyD:'#61666e', trim:'#c30452', pants:'#8f959e', pantsD:'#686e76', cap:'#1c1c22', sock:'#1c1c22', glove:'#1c1c22' },
};
const SKIN = '#dfae86', SKIN_D = '#bf8c66';

// ───────── 경기 규칙 ─────────
let G = null;
function newGame(innings){
  G = { innings, maxInn: innings + 2, inning:1, half:'top', outs:0, balls:0, strikes:0, bases:[0,0,0],
        score:{away:0,home:0}, bi:{away:0,home:0}, over:false, result:null,
        pitcher:{home:SAM.pitchers[0], away:LG.pitchers[0]}, pc:{home:0,away:0}, used:{home:new Set(),away:new Set()} };
}
const batSide = () => G.half === 'top' ? 'away' : 'home';
const pitSide = () => G.half === 'top' ? 'home' : 'away';
const curBatter = () => TEAM[batSide()].batters[G.bi[batSide()]];
// 피로: 체력의 절반을 넘기면서부터 서서히 쌓여 1까지
const fatigue = (pc, st) => clamp((pc - st * 0.5) / (st * 0.9), 0, 1);
const energy = (pc, st) => 1 - clamp(pc / (st * 1.4), 0, 1);

function applyEvent(t){
  const b = G.bases; let runs = 0, pa = false;
  switch (t) {
    case 'BALL': if (++G.balls >= 4) { if (b[0]&&b[1]&&b[2]) runs = 1; else if (b[0]&&b[1]) b[2]=1; else if (b[0]) b[1]=1; b[0]=1; pa = true; } break;
    case 'STRIKE': if (++G.strikes >= 3) { G.outs++; pa = true; } break;
    case 'FOUL': if (G.strikes < 2) G.strikes++; break;
    case 'OUT': G.outs++; pa = true; break;
    case 'SAC_FLY': G.outs++; if (G.outs < 3 && b[2]) { runs = 1; b[2] = 0; } pa = true; break;
    case 'DOUBLE_PLAY': G.outs += 2; b[0] = 0; pa = true; break;
    case 'SINGLE': runs = b[2] + b[1]; G.bases = [1, b[0], 0]; pa = true; break;
    case 'DOUBLE': runs = b[2] + b[1]; G.bases = [0, 1, b[0]]; pa = true; break;
    case 'TRIPLE': runs = b[0] + b[1] + b[2]; G.bases = [0, 0, 1]; pa = true; break;
    case 'HR': runs = b[0] + b[1] + b[2] + 1; G.bases = [0, 0, 0]; pa = true; break;
  }
  const side = batSide();
  if (G.outs < 3) G.score[side] += runs; else runs = 0;
  if (pa) { G.balls = 0; G.strikes = 0; G.bi[side] = (G.bi[side] + 1) % 9; }
  let halfOver = false;
  if (G.half === 'bottom' && G.inning >= G.innings && G.score.home > G.score.away) { G.over = true; G.result = 'home'; return {runs, pa, halfOver}; }
  if (G.outs >= 3) {
    halfOver = true;
    if (G.half === 'top') {
      if (G.inning >= G.innings && G.score.home > G.score.away) { G.over = true; G.result = 'home'; }
      else G.half = 'bottom';
    } else {
      if (G.inning >= G.innings && G.score.home !== G.score.away) { G.over = true; G.result = G.score.home > G.score.away ? 'home' : 'away'; }
      else if (G.inning >= G.maxInn) { G.over = true; G.result = 'draw'; }
      else { G.inning++; G.half = 'top'; }
    }
    G.outs = 0; G.bases = [0,0,0]; G.balls = 0; G.strikes = 0;
  }
  return {runs, pa, halfOver};
}

// ───────── 투구 계산 ─────────
const sweetOf = (p, pc) => (0.07 + p.control / 100 * 0.12) * (1 - 0.6 * fatigue(pc, p.stamina));
const periodOf = (p, pc) => GAUGE_PERIOD * (1 - 0.25 * fatigue(pc, p.stamina));
const isStrike = pl => Math.abs(pl.x) <= 1 + BALL_R && Math.abs(pl.y) <= 1 + BALL_R / 1.2;
function computePitch(p, type, target, gpos, pc){
  const f = fatigue(pc, p.stamina);
  const sweet = sweetOf(p, pc);
  const err = Math.abs(gpos - 0.5) * 2;
  const on = err <= sweet;
  const t = PT[type];
  const speed = Math.floor(p.velo * t.m * (on ? 1 : .96) * (1 - .07 * f) * (1 - .01 * rnd()));
  const base = 0.06 + (1 - p.control / 100) * 0.25;
  const spread = base * (on ? 1 + (err / sweet) * 0.8 : 2.5 + 4 * err) * (1 + 1.2 * f);
  const plate = { x: target.x + spread * randN(), y: target.y + spread * randN() };
  const sign = p.throws === 'L' ? -1 : 1;
  return { type, speed, plate, on, err, sweet, bx: t.bx * sign, by: t.by, throws: p.throws,
           travel: 18.44 / (speed / 3.6) * 1000 * SPEED_SCALE, strike: isStrike(plate) };
}

// ───────── 스윙과 타구 ─────────
const windowMs = c => 18 + c * 0.3;
function swingResult(diff, batter, pitch){
  const w = windowMs(batter.contact);
  const m = Math.max(Math.abs(pitch.plate.x), Math.abs(pitch.plate.y));
  if (Math.abs(diff) > w * 5 || m > 1.6) return { kind:'MISS', q:0, pull:0 };
  const q = 1 - Math.abs(diff) / (w * 5) - Math.max(0, m - 0.6) * 0.35 - (Math.abs(pitch.bx) + Math.abs(pitch.by)) * 0.08;
  if (q < 0.25) return { kind: rnd() < .5 ? 'FOUL' : 'MISS', q, pull:0 };
  const pull = clamp(-diff / (w * 3), -1, 1);
  if (Math.abs(pull) > 0.9) return { kind:'FOUL', q, pull };
  return { kind:'INPLAY', q, pull };
}
function battedBall(q, power){
  const pHR = q > 0.78 ? (q - 0.78) / 0.22 * (0.10 + power / 100 * 0.55) : 0;
  if (rnd() < pHR) return ['HR', '홈런!!'];
  if (rnd() < 0.05 + q * 0.40) {
    const r = rnd();
    if (r < 0.03) return ['TRIPLE', '3루타!'];
    if (r < 0.03 + q * 0.25 * (0.5 + power / 100)) return ['DOUBLE', '2루타!'];
    return ['SINGLE', '안타!'];
  }
  const fly = rnd() < 0.5, b = G.bases;
  if (fly && b[2] && G.outs < 2) return ['SAC_FLY', '희생플라이'];
  if (!fly && b[0] && G.outs < 2 && rnd() < 0.35) return ['DOUBLE_PLAY', '병살타'];
  return ['OUT', fly ? '뜬공 아웃' : '땅볼 아웃'];
}

// ───────── 컴퓨터 AI ─────────
function cpuPitch(p, pc){
  const ws = p.pitches.map(k => k === 'FB' || k === 'SI' ? 3 : 1.5);
  let r = rnd() * ws.reduce((a, c) => a + c), i = 0; while ((r -= ws[i]) > 0) i++;
  const inZone = rnd() < 0.55 + (G.balls >= 3 ? 0.25 : 0) - (G.strikes === 2 ? 0.2 : 0);
  let target;
  if (inZone) target = { x: (rnd()*2-1) * 0.85, y: (rnd()*2-1) * 0.85 };
  else { const a = rnd() * Math.PI * 2, rr = 1.3 + rnd() * 0.35; target = { x: Math.cos(a) * rr, y: Math.sin(a) * rr }; }
  const gpos = 0.5 + randN() * 0.05 * (1.3 - p.control / 100);
  return computePitch(p, p.pitches[i], target, gpos, pc);
}
function cpuSwing(batter, pitch, pitcher){
  const m = Math.max(Math.abs(pitch.plate.x), Math.abs(pitch.plate.y));
  let ps;
  if (pitch.strike) ps = 0.68 + G.strikes * 0.1;
  else if (m <= 1.6) ps = 0.35 * (1 - batter.eye / 150) + G.strikes * 0.12;
  else ps = 0.04;
  if (rnd() >= ps) return null;
  let sigma = 30 + (100 - batter.contact) * 0.5 + Math.max(0, pitch.speed - 135) + (Math.abs(pitch.bx) + Math.abs(pitch.by)) * 35;
  if (pitcher.velo - pitch.speed > 10) sigma += 15;
  return randN() * sigma;
}

// ───────── 소리 · 진동 · 흔들림 ─────────
let AC = null;
function unlockAudio(){
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
}
function noise(dur, freq, q, gain, attack = 0.002){
  if (!AC) return;
  const n = Math.floor(AC.sampleRate * dur), buf = AC.createBuffer(1, n, AC.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (rnd() * 2 - 1);
  const src = AC.createBufferSource(); src.buffer = buf;
  const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
  const g = AC.createGain(), t = AC.currentTime;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(gain, t + attack); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(f).connect(g).connect(AC.destination); src.start();
}
function tone(freq, dur, gain, type = 'sine'){
  if (!AC) return;
  const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
  o.type = type; o.frequency.setValueAtTime(freq, t); o.frequency.exponentialRampToValueAtTime(freq * 0.5, t + dur);
  g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(AC.destination); o.start(); o.stop(t + dur);
}
const sfx = {
  hit:   () => { noise(0.09, 2600, 1.2, 1.0); tone(1100, 0.07, 0.5, 'triangle'); },
  mitt:  () => { noise(0.07, 380, 1, 0.9); tone(110, 0.09, 0.6); },
  whiff: () => noise(0.18, 700, 0.7, 0.25, 0.05),
  cheer: () => noise(1.8, 1300, 0.4, 0.5, 0.35),
  ooh:   () => noise(0.9, 900, 0.5, 0.3, 0.2),
};
function vibrate(ms){ try { if (typeof navigator.vibrate === 'function') navigator.vibrate(ms); } catch (e) {} }
function shake(strength){
  try { cv.animate([{transform:'translate(0,0)'},{transform:`translate(${strength}px,${-strength}px)`},{transform:`translate(${-strength}px,${strength*.6}px)`},{transform:'translate(0,0)'}], {duration:220}); } catch (e) {}
}

// ───────── 선수 그리기 (관절 리그) ─────────
let ctx;
const L = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
function lerpPose(a, b, t){ const o = {}; for (const k in a) o[k] = typeof a[k] === 'number' ? a[k] + (b[k] - a[k]) * t : L(a[k], b[k], t); return o; }
const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
function seqPose(keys, u){
  if (u <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) if (u <= keys[i][0]) { const [t0, p0] = keys[i - 1], [t1, p1] = keys[i]; return lerpPose(p0, p1, ease((u - t0) / (t1 - t0))); }
  return keys[keys.length - 1][1];
}
function seg(a, b, w, color){ ctx.strokeStyle = color; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke(); }
function leg(hip, knee, foot, u, dark, shoeDir){
  seg(hip, knee, 17, dark ? u.pantsD : u.pants);
  const sockStart = L(knee, foot, 0.45);
  seg(knee, sockStart, 14, dark ? u.pantsD : u.pants);
  seg(sockStart, foot, 11, u.sock);
  ctx.fillStyle = '#15151a'; ctx.beginPath(); ctx.ellipse(foot[0] + 5 * shoeDir, foot[1] + 1, 11, 5, 0, 0, Math.PI * 2); ctx.fill();
}
function arm(sh, el, hand, u, dark, handColor){
  seg(sh, el, 12, dark ? u.jerseyD : u.jersey);
  seg(L(sh, el, 0.55), el, 12.5, dark ? u.jerseyD : u.jersey);
  seg(el, hand, 9.5, dark ? SKIN_D : SKIN);
  ctx.fillStyle = handColor || (dark ? SKIN_D : SKIN); ctx.beginPath(); ctx.arc(hand[0], hand[1], 5.5, 0, Math.PI * 2); ctx.fill();
}
function torso(ls, rs, hip, u, shadeLeft){
  const g = ctx.createLinearGradient(Math.min(ls[0], rs[0]) - 6, 0, Math.max(ls[0], rs[0]) + 6, 0);
  g.addColorStop(0, shadeLeft ? u.jerseyD : u.jersey); g.addColorStop(1, shadeLeft ? u.jersey : u.jerseyD);
  ctx.fillStyle = g; ctx.beginPath();
  ctx.moveTo(ls[0] - 3, ls[1] - 2); ctx.lineTo(rs[0] + 3, rs[1] - 2);
  ctx.quadraticCurveTo(rs[0] + 2, (rs[1] + hip[1]) / 2, hip[0] + 13, hip[1]);
  ctx.lineTo(hip[0] - 13, hip[1]);
  ctx.quadraticCurveTo(ls[0] - 2, (ls[1] + hip[1]) / 2, ls[0] - 3, ls[1] - 2);
  ctx.fill();
  ctx.strokeStyle = u.trim; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo((ls[0] + rs[0]) / 2, (ls[1] + rs[1]) / 2 - 1); ctx.lineTo(hip[0], hip[1] - 4); ctx.stroke();
  ctx.fillStyle = u.trim; ctx.fillRect(hip[0] - 14, hip[1] - 3, 28, 5);     // 벨트
}

// 타자 (옆모습, +x가 홈플레이트/투수 쪽)
const BAT_STANCE = { head:[6,-166], neck:[2,-150], hip:[-2,-96], bs:[-10,-146], fs:[12,-146], be:[-28,-126], fe:[-2,-120], hands:[-16,-142], bk:[-16,-52], fk:[22,-54], bf:[-26,0], ff:[30,0], bat:-2.0 };
const BAT_LOAD   = { ...BAT_STANCE, hands:[-24,-140], be:[-32,-122], fe:[-8,-120], ff:[46,0], fk:[32,-50], bat:-2.25 };
const BAT_CONTACT= { head:[12,-160], neck:[7,-147], hip:[4,-94], bs:[-4,-140], fs:[18,-142], be:[2,-116], fe:[24,-124], hands:[32,-116], bk:[-8,-48], fk:[32,-52], bf:[-20,-2], ff:[46,0], bat:0.05 - Math.PI * 2 };
const BAT_FINISH = { head:[12,-158], neck:[8,-146], hip:[4,-94], bs:[-2,-142], fs:[16,-142], be:[-12,-138], fe:[16,-140], hands:[-4,-154], bk:[-6,-46], fk:[32,-52], bf:[-14,-6], ff:[46,0], bat:-2.6 - Math.PI * 2 };
function drawBatterFig(x, y, s, facing, Pz, u){
  ctx.save(); ctx.translate(x, y); ctx.scale(s * facing, s);
  ctx.fillStyle = 'rgba(0,0,0,.28)'; ctx.beginPath(); ctx.ellipse(8, 2, 52, 9, 0, 0, Math.PI * 2); ctx.fill();
  const hipB = [Pz.hip[0] - 7, Pz.hip[1]], hipF = [Pz.hip[0] + 7, Pz.hip[1]];
  leg(hipB, Pz.bk, Pz.bf, u, true, 1);

// 투수 (정면/뒷모습 공용, 우투 기준 던지는 팔 = 화면 왼쪽)
const PIT_SET = { head:[0,-168], neck:[0,-152], hip:[0,-98], ls:[-16,-146], rs:[16,-146], lE:[-20,-124], rE:[18,-124], lH:[-4,-122], rH:[4,-124], lK:[-10,-50], rK:[10,-50], lF:[-12,0], rF:[12,0] };
const PIT_LIFT = { ...PIT_SET, head:[-2,-170], neck:[-2,-154], hip:[-2,-100], lK:[-8,-50], lF:[-10,0], rK:[10,-104], rF:[6,-64], lH:[-2,-136], rH:[2,-136], lE:[-18,-132], rE:[16,-132] };
const PIT_COCK = { head:[6,-156], neck:[4,-140], hip:[4,-84], ls:[-14,-136], rs:[20,-134], lE:[-36,-140], lH:[-30,-170], rE:[32,-128], rH:[40,-118], lK:[-14,-44], lF:[-24,0], rK:[18,-46], rF:[28,4] };
const PIT_REL  = { head:[2,-148], neck:[2,-132], hip:[4,-82], ls:[-14,-132], rs:[16,-128], lE:[-14,-152], lH:[-4,-164], rE:[20,-110], rH:[12,-104], lK:[-16,-46], lF:[-24,0], rK:[16,-44], rF:[24,4] };
const PIT_FOL  = { head:[12,-132], neck:[10,-118], hip:[6,-80], ls:[-6,-118], rs:[22,-116], lE:[4,-96], lH:[18,-78], rE:[26,-100], rH:[18,-112], lK:[-14,-40], lF:[-22,-8], rK:[16,-42], rF:[24,4] };
function drawPitcherFig(x, y, s, m, Pz, u, back, holdBall, who){
  ctx.save(); ctx.translate(x, y); ctx.scale(s * m, s);
  ctx.fillStyle = 'rgba(0,0,0,.28)'; ctx.beginPath(); ctx.ellipse(0, 3, 46, 9, 0, 0, Math.PI * 2); ctx.fill();
  leg([Pz.hip[0] - 8, Pz.hip[1]], Pz.lK, Pz.lF, u, true, 0);
  leg([Pz.hip[0] + 8, Pz.hip[1]], Pz.rK, Pz.rF, u, false, 0);
  // 팔이 몸 뒤로 갈 때(COCK) 던지는 팔을 먼저 그림
  const throwBehind = Pz.lH[1] < Pz.ls[1] - 10 && Pz.lH[0] < Pz.ls[0];
  if (throwBehind) arm(Pz.ls, Pz.lE, Pz.lH, u, true);
  torso(Pz.ls, Pz.rs, Pz.hip, u, !back);
  if (back && who) {     // 등번호와 이름 (좌우 반전 방지)
    const cx = (Pz.ls[0] + Pz.rs[0]) / 2, cy = (Pz.ls[1] + Pz.hip[1]) / 2;

    ctx.font = 'bold 22px system-ui'; ctx.fillText(String(who.num), 0, 8);
    ctx.restore();
  }
  arm(Pz.rs, Pz.rE, Pz.rH, u, false);
  ctx.fillStyle = '#7a4a22'; ctx.beginPath(); ctx.ellipse(Pz.rH[0] + 2, Pz.rH[1], 10, 12, 0.3, 0, Math.PI * 2); ctx.fill();   // 글러브
  ctx.strokeStyle = '#5a3416'; ctx.lineWidth = 1.5; ctx.stroke();
  if (!throwBehind) arm(Pz.ls, Pz.lE, Pz.lH, u, false);
  if (holdBall) { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(Pz.lH[0], Pz.lH[1] - 3, 3.5, 0, Math.PI * 2); ctx.fill(); }

  if (back) { ctx.fillStyle = SKIN_D; ctx.fillRect(Pz.head[0] - 5, Pz.head[1] + 6, 10, 6); }
  ctx.fillStyle = u.cap; ctx.beginPath(); ctx.arc(Pz.head[0], Pz.head[1] - 3, 12, Math.PI, Math.PI * 2); ctx.fill();

    ctx.beginPath(); ctx.ellipse(Pz.head[0], Pz.head[1] - 3, 14, 3.5, 0, 0, Math.PI); ctx.fill();          // 챙
    ctx.fillStyle = '#2a1f1a'; ctx.fillRect(Pz.head[0] - 5, Pz.head[1] + 1, 2.5, 2); ctx.fillRect(Pz.head[0] + 2.5, Pz.head[1] + 1, 2.5, 2);

}
function pitcherPose(now){
  let rel = null, wind = 0;
  if (ball) { rel = ball.start; wind = ball.wind; }
  else if (mode === 'bwait' && pitchAt) { rel = pitchAt; wind = WIND_CPU; }
  if (rel == null) return { pose: PIT_SET, hold: true };
  if (now < rel) {
    const u = (now - (rel - wind)) / wind;
    return { pose: seqPose([[0, PIT_SET], [0.4, PIT_LIFT], [0.8, PIT_COCK], [1, PIT_REL]], u), hold: true };
  }
  return { pose: lerpPose(PIT_REL, PIT_FOL, ease(clamp((now - rel) / 260, 0, 1))), hold: false };
}
function batterPose(now){
  if (swingFlash) {
    const t = now - swingFlash;
    if (t < 70) return lerpPose(BAT_LOAD, BAT_CONTACT, t / 70);
    if (t < 260) return lerpPose(BAT_CONTACT, BAT_FINISH, ease((t - 70) / 190));
    return BAT_FINISH;
  }
  if (ball && !ball.hit && now >= ball.start) return lerpPose(BAT_STANCE, BAT_LOAD, ease(clamp(((now - ball.start) / ball.pitch.travel - 0.15) / 0.5, 0, 1)));

}

const cv = $('#cv'), mainCtx = cv.getContext('2d'), controls = $('#controls');
ctx = mainCtx;

// catcher: 타격 시점(포수 뒤) / pitcher: 투구 시점(투수 뒤, 좌우 반전)
function makeView(kind){

    return { kind, zw, zh, cx: W / 2, cy, mirror: false, d0: 18.5, d1: 1.5, feetY: cy + zh * 1.06, figH: zh * 2,

const fromS = (sx, sy) => ({ x: (V.mirror ? -1 : 1) * (sx - V.cx) / (V.zw / 2), y: -(sy - V.cy) / (V.zh / 2) });

// 상태
let mode = 'idle';      // aim | pick | gauge | flight | bwait | bflight | msg | bullpen | end
let target = { x: 0, y: 0 }, dragging = false, pitchType = null, gaugeStart = 0, gaugePeriod = GAUGE_PERIOD;
let ball = null;        // { pitch, start, wind, arrival, hit, swung, cpuDiff }
let pitchAt = 0;
let play = null;
let msg = null;

function updateBoard(){
  $('#sc').textContent = `LG ${G.score.away} : ${G.score.home} 삼성`;

function setControls(html){ controls.innerHTML = html; }

function nextPlay(){

  ball = null; play = null; swingFlash = 0; pitchAt = 0;

    mode = 'aim'; pitchType = null;

  } else {
    const p = G.pitcher.away;

      if (nx) { G.used.away.add(p.name); G.pitcher.away = nx; G.pc.away = 0; updateBoard(); mode = 'msg'; showMsg(`LG 투수 교체: ${nx.name}`, '#9fb3cc', 1200, null, nextPlay); return; }
    }
    mode = 'bwait';
    pitchAt = performance.now() + WIND_CPU + 700 + rnd() * 900;
    setControls(`<p>공이 오면 <b>타이밍에 맞춰 화면을 터치</b>해서 스윙!</p>`);

}

function showBullpen(){
  const cur = G.pitcher.home;
  const list = SAM.pitchers.filter(p => p !== cur && !G.used.home.has(p.name));
  mode = 'bullpen';
  setControls(`<div class="list">${list.map((p, i) => `<button data-i="${i}">${p.name} · ${p.velo}km/h · 제구 ${p.control} · 체력 ${p.stamina}</button>`).join('') || '<p>남은 투수가 없어요</p>'}<button class="ghost" id="bpc">취소</button></div>`);

    G.used.home.add(cur.name); G.pitcher.home = list[+btn.dataset.i]; G.pc.home = 0; nextPlay();
  });

}

function showPitchButtons(){
  const p = G.pitcher.home;
  mode = 'pick';
  setControls(`<p>구종을 고르세요 (다시 드래그하면 위치 변경)</p><div class="row">${p.pitches.map(k => `<button data-k="${k}">${PT[k].n}</button>`).join('')}</div>`);
  controls.querySelectorAll('[data-k]').forEach(btn => btn.onclick = () => {
    pitchType = btn.dataset.k; mode = 'gauge'; gaugeStart = performance.now(); gaugePeriod = periodOf(p, G.pc.home);
    setControls(`<p><b>${PT[pitchType].n}</b> · 게이지가 <b style="color:var(--green)">초록 구간 한가운데</b>일 때 화면을 터치!</p>`);
  });
}

function gaugePos(now){ const t = ((now - gaugeStart) % gaugePeriod) / gaugePeriod; return t < .5 ? t * 2 : 2 - t * 2; }

function throwUserPitch(now){
  const p = G.pitcher.home;
  const pitch = computePitch(p, pitchType, target, gaugePos(now), G.pc.home);
  const batter = curBatter();
  const start = performance.now() + WIND_USER;
  ball = { pitch, start, wind: WIND_USER, arrival: start + pitch.travel, cpuDiff: cpuSwing(batter, pitch, p), hit: null };
  mode = 'flight';
  const grade = !pitch.on ? '<b style="color:var(--red)">타이밍 실패 — 제구 흔들림</b>'
    : pitch.err < pitch.sweet * 0.35 ? '<b style="color:var(--green)">완벽한 타이밍!</b>' : '<b style="color:var(--yellow)">괜찮은 타이밍</b>';
  setControls(`<p>${grade}</p>`);
}

function throwCpuPitch(){
  const p = G.pitcher.away;
  const pitch = cpuPitch(p, G.pc.away);
  ball = { pitch, start: pitchAt, wind: WIND_CPU, arrival: pitchAt + pitch.travel, hit: null, swung: false };
  mode = 'bflight';
}

function resolveUserPitch(){
  const pitch = ball.pitch, batter = curBatter();
  G.pc.home++;
  lastPitchInfo = `${pitch.speed}km/h ${PT[pitch.type].n}`;
  let ev, label, swing = null;
  if (ball.cpuDiff == null) { ev = pitch.strike ? 'STRIKE' : 'BALL'; label = pitch.strike ? '스트라이크' : '볼'; sfx.mitt(); }
  else {
    swingFlash = performance.now() - 70;
    const r = swingResult(ball.cpuDiff, batter, pitch);
    if (r.kind === 'MISS') { ev = 'STRIKE'; label = '헛스윙'; sfx.whiff(); sfx.mitt(); }
    else if (r.kind === 'FOUL') { ev = 'FOUL'; label = '파울'; sfx.hit(); ball.hit = { ...r, at: performance.now() }; }
    else { [ev, label] = battedBall(r.q, batter.power); sfx.hit(); ball.hit = { ...r, at: performance.now() }; swing = r; }
  }
  finishPitch(ev, label, true, swing);
}

function userSwing(ts){
  if (!ball || ball.swung) return;
  ball.swung = true; swingFlash = performance.now();
  const batter = curBatter();
  const diff = ts - ball.arrival;
  const r = swingResult(diff, batter, ball.pitch);
  if (r.kind === 'MISS') { sfx.whiff(); return; }
  sfx.hit(); vibrate(r.kind === 'INPLAY' && r.q > 0.8 ? 70 : 35); shake(r.kind === 'INPLAY' ? 4 + r.q * 8 : 3);
  ball.hit = { ...r, at: performance.now() };
  const diffTxt = `${diff < 0 ? '빠름' : '늦음'} ${Math.abs(Math.round(diff))}ms`;
  G.pc.away++;
  lastPitchInfo = `${ball.pitch.speed}km/h ${PT[ball.pitch.type].n} · ${diffTxt}`;
  if (r.kind === 'FOUL') return finishPitch('FOUL', '파울', false, null);
  const [ev, label] = battedBall(r.q, batter.power);
  if (ev === 'HR') vibrate([80, 60, 120]);
  finishPitch(ev, label, false, r);
}

function resolveTake(){
  const p = ball.pitch;
  G.pc.away++; sfx.mitt();
  let ev, label;
  if (ball.swung) { ev = 'STRIKE'; label = '헛스윙'; }
  else { ev = p.strike ? 'STRIKE' : 'BALL'; label = p.strike ? '스트라이크' : '볼'; }
  lastPitchInfo = `${p.speed}km/h ${PT[p.type].n}`;
  finishPitch(ev, label, false, null);
}

function finishPitch(ev, label, userPitched, swing){
  mode = 'msg';
  if (['BALL','STRIKE','FOUL'].includes(ev)) return settle(ev, label, userPitched);
  startPlay(ev, label, swing, curBatter(), () => settle(ev, label, userPitched));
}

function settle(ev, label, userPitched){
  const wasStrikes = G.strikes, wasBalls = G.balls;
  const r = applyEvent(ev);
  if (ev === 'STRIKE' && wasStrikes === 2) label = '삼진!';
  if (ev === 'BALL' && wasBalls === 3) label = '볼넷';
  const good = userPitched ? ['STRIKE','OUT','SAC_FLY','DOUBLE_PLAY'].includes(ev) : ['SINGLE','DOUBLE','TRIPLE','HR','BALL'].includes(ev);
  const color = ev === 'FOUL' ? '#fff' : good ? '#2ecc71' : '#e74c3c';
  const sub = (r.runs ? `${r.runs}점 득점! · ` : '') + lastPitchInfo;
  mode = 'msg';
  showMsg(label, color, ev === 'HR' ? 2000 : 1300, sub, () => {
    if (G.over) { updateBoard(); return showEnd(); }
    if (r.halfOver) { updateBoard(); play = null; ball = null; return showMsg('공수교대', '#9fb3cc', 1200, `${G.inning}회${G.half === 'top' ? '초 · 내가 투수' : '말 · 내가 타자'}`, nextPlay); }
    nextPlay();
  });
  updateBoard();
}

function showMsg(text, color, ms, sub, then){
  msg = { text, color, sub, until: performance.now() + ms };
  setTimeout(() => { msg = null; then && then(); }, ms);
}

function showEnd(){
  mode = 'end';
  const res = G.result === 'home' ? '삼성 승리!' : G.result === 'away' ? 'LG 승리' : '무승부';
  $('#overlay').innerHTML = `<div class="tag">경기 종료</div><h1>${res}</h1><p style="font-size:22px;margin:0">LG ${G.score.away} : ${G.score.home} 삼성</p><button id="again">다시 하기</button>`;
  $('#overlay').classList.remove('hidden');
  $('#again').onclick = () => location.reload();
  setControls('');
}

// ───────── 타구 화면 (위에서 내려다본 경기장) ─────────
const FIELDERS = { P:[0,60], C:[0,-5], '1B':[38,100], '2B':[14,148], SS:[-14,148], '3B':[-38,100], LF:[-28,285], CF:[0,315], RF:[28,285] };
const polar = (deg, dist) => { const a = deg * Math.PI / 180; return { x: Math.sin(a) * dist, y: Math.cos(a) * dist }; };
const fieldPos = name => polar(FIELDERS[name][0], FIELDERS[name][1]);
const fenceAt = deg => 330 + 70 * Math.cos(deg * Math.PI / 90);
function nearest(pt, names){
  let best = null, bd = 1e9;
  for (const n of names) { const f = fieldPos(n), d = Math.hypot(f.x - pt.x, f.y - pt.y); if (d < bd) { bd = d; best = n; } }
  return best;
}
function startPlay(ev, label, swing, batter, then){
  const hand = batter.bats === 'L' ? 1 : -1;
  const pull = swing ? swing.pull : 0;
  let ang = clamp(hand * pull * 35 + randN() * 7, -42, 42);
  let dist, maxH, ground = false, catcher = null, hit = true;
  const IF = ['1B','2B','SS','3B'], OF = ['LF','CF','RF'];
  switch (ev) {
    case 'HR': dist = fenceAt(ang) + 15 + rnd() * 40; maxH = 120; break;
    case 'TRIPLE': ang = (ang < 0 ? -1 : 1) * (18 + rnd() * 8); dist = fenceAt(ang) - 6; maxH = 45; break;
    case 'DOUBLE': ang = rnd() < .5 ? (ang < 0 ? -1 : 1) * (15 + rnd() * 10) : (ang < 0 ? -1 : 1) * (36 + rnd() * 6); dist = 250 + rnd() * 50; maxH = 40; break;
    case 'SINGLE':
      if (rnd() < .5) { const gaps = [-26, -4, 4, 26]; ang = gaps[Math.floor(rnd() * 4)] + randN() * 3; dist = 200; maxH = 3; ground = true; }
      else { dist = 165 + rnd() * 45; maxH = 28; }
      break;
    case 'SAC_FLY': { const f = OF[Math.floor(rnd() * 3)]; ang = FIELDERS[f][0] + randN() * 4; dist = 300 + rnd() * 20; maxH = 75; catcher = f; hit = false; break; }
    default: {
      hit = false;
      if (ev === 'DOUBLE_PLAY' || label.includes('땅볼')) {
        ground = true; const f = nearest(polar(ang, 140), IF); catcher = f;
        ang = FIELDERS[f][0] + randN() * 4; dist = FIELDERS[f][1] - 5 + randN() * 6; maxH = 2;
      } else {
        const deep = rnd() < .5;
        const f = deep ? nearest(polar(ang, 280), OF) : nearest(polar(ang, 160), [...IF, ...OF]); catcher = f;
        ang = FIELDERS[f][0] + randN() * 6; dist = FIELDERS[f][1] + randN() * 25; maxH = deep ? 85 : 60;
      }
    }
  }
  const to = polar(ang, dist);
  const dur = ground ? 650 + dist * 1.2 : 900 + dist * 2.4;
  const chaser = catcher || nearest(to, ['LF','CF','RF','1B','2B','SS','3B']);
  play = { start: performance.now() + 320, dur, to, maxH, ground, catcher, chaser, hit, ev, label, landed: false, then, basesBefore: [...G.bases] };
}
function updatePlay(now){
  const t = (now - play.start) / play.dur;
  if (t >= 1 && !play.landed) {

  const p = G.pitcher.home, sw = sweetOf(p, G.pc.home);
  const bw = W * 0.8, bx = (W - bw) / 2, by = H - 30, bh = 16;
  ctx.fillStyle = 'rgba(10,20,36,.85)'; ctx.fillRect(bx - 4, by - 4, bw + 8, bh + 8);
  ctx.fillStyle = '#22344d'; ctx.fillRect(bx, by, bw, bh);
  ctx.fillStyle = '#2ecc71'; ctx.fillRect(bx + bw * (0.5 - sw / 2), by, bw * sw, bh);
  ctx.fillStyle = '#7dffb0'; ctx.fillRect(bx + bw * (0.5 - sw * 0.35 / 2), by, bw * sw * 0.35, bh);
  ctx.fillStyle = '#fff'; const mx = bx + bw * gaugePos(now); ctx.fillRect(mx - 2, by - 6, 4, bh + 12);
}
function drawHUD(){
  const ps = pitSide(), p = G.pitcher[ps], f = fatigue(G.pc[ps], p.stamina);
  const left = energy(G.pc[ps], p.stamina);
  ctx.fillStyle = 'rgba(6,16,29,.6)'; ctx.fillRect(10, 10, 116, 36);
  ctx.fillStyle = '#dfe8f3'; ctx.font = '12px system-ui'; ctx.textAlign = 'left'; ctx.fillText(`${p.name} 체력${f > 0 ? ' · 지침' : ''}`, 16, 25);
  ctx.fillStyle = '#22344d'; ctx.fillRect(16, 32, 104, 7);
  ctx.fillStyle = f > 0.5 ? '#e74c3c' : f > 0 ? '#f1c40f' : '#2ecc71'; ctx.fillRect(16, 32, 104 * left, 7);
  const cx = W - 36, cy = 30, d = 11;
  ctx.fillStyle = 'rgba(6,16,29,.6)'; ctx.fillRect(cx - 24, cy - 20, 48, 34);
  [[cx + d, cy], [cx, cy - d], [cx - d, cy]].forEach(([x, y], i) => {
    ctx.save(); ctx.translate(x, y); ctx.rotate(Math.PI / 4); ctx.fillStyle = G.bases[i] ? '#f1c40f' : 'rgba(255,255,255,.25)'; ctx.fillRect(-5, -5, 10, 10); ctx.restore();
  });
}
function drawMsg(){
  if (!msg) return;
  ctx.textAlign = 'center';
  const y = V && V.kind === 'pitcher' ? H * 0.2 : H * 0.14;
  ctx.font = 'bold 40px system-ui'; ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(0,0,0,.65)';
  ctx.strokeText(msg.text, W / 2, y); ctx.fillStyle = msg.color; ctx.fillText(msg.text, W / 2, y);
  if (msg.sub) { ctx.font = '15px system-ui'; ctx.lineWidth = 4; ctx.strokeText(msg.sub, W / 2, y + 28); ctx.fillStyle = '#dfe8f3'; ctx.fillText(msg.sub, W / 2, y + 28); }
  ctx.textAlign = 'left';
}

function frame(now){
  requestAnimationFrame(frame);
  if (!W) resize();
  if (!G || !V) { ctx.fillStyle = '#0b1a2e'; ctx.fillRect(0, 0, W, H); return; }
  if (mode === 'bwait' && pitchAt && now >= pitchAt) throwCpuPitch();
  if (play && now >= play.start) { drawField(now); drawMsg(); return; }

  if (!bgCache[V.kind]) bgCache[V.kind] = buildBackdrop(V.kind);
  ctx.drawImage(bgCache[V.kind], 0, 0, W, H);
  const pitching = V.kind === 'pitcher';
  const bp = ball && !ball.hit && now >= ball.start ? ballScreen(now) : null;

  if (pitching) {
    const aimShown = mode === 'aim' || mode === 'pick' || mode === 'gauge' || (ball && !ball.hit);
    drawUmpireAndCatcher(aimShown);
    drawZone(0.7);
    drawBatter(now);
    if (bp && bp.prog <= 1.02) drawBall(bp.x, bp.y, bp.r);
    drawMyPitcher(now);
  } else {
    drawMoundPitcher(now);
    drawZone(0.35);
    if (bp && bp.prog <= 1.02) drawBall(bp.x, bp.y, bp.r);
    drawBatter(now);
  }
  drawHUD();
  if (mode === 'gauge') drawGauge(now);

  if (ball) {
    if (ball.hit) {
      const t = (now - ball.hit.at) / 600;
      if (t < 1) {
        const [px, py] = toS(ball.pitch.plate.x, ball.pitch.plate.y);
        const dir = (V.mirror ? 1 : -1) * ball.hit.pull * 0.8 + (ball.hit.kind === 'FOUL' ? 1.2 : 0);
        const x = px + dir * W * 0.5 * t;
        const y = pitching ? py + H * 0.6 * t - H * 0.9 * t * (1 - t) : py - H * 0.7 * t * (0.6 + ball.hit.q * 0.6);
        drawBall(x, y, pitching ? V.zw * 0.085 * (1 + t * 3) : Math.max(2, V.zw * 0.085 * (1 - t * 0.85)));
      }
    } else if (bp) {
      if (mode === 'flight' && bp.prog >= 1) resolveUserPitch();
      else if (mode === 'bflight' && now > ball.arrival + 220) { mode = 'msg'; resolveTake(); }
      if (bp.prog >= 1 && mode === 'msg') { const [px, py] = toS(ball.pitch.plate.x, ball.pitch.plate.y); ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(px, py, V.zw * BALL_R / 2, 0, Math.PI * 2); ctx.stroke(); }
    }
  }
  drawMsg();
}
requestAnimationFrame(frame);

// ───────── 화면 확인용 (#pitch, #bat, #field) ─────────
if (location.hash) {
  const h = location.hash.slice(1);
  setTimeout(() => {
    newGame(1); resize(); $('#overlay').classList.add('hidden');
    if (h === 'bat' || h === 'field') G.half = 'bottom';
    nextPlay();
    if (h === 'pitch') { target = { x: 0.6, y: -0.4 }; }
    if (h === 'bat') { pitchAt = performance.now() + 400; }
    if (h === 'field') { mode = 'msg'; startPlay('DOUBLE', '2루타!', { pull: 0.5 }, curBatter(), () => {}); play.start = performance.now() - 900; }
  }, 50);
}

// ───────── 시작 ─────────
document.querySelectorAll('[data-inn]').forEach(b => b.onclick = () => {
  unlockAudio();
  newGame(+b.dataset.inn);
  resize();
  $('#overlay').classList.add('hidden');
  mode = 'msg';
  showMsg('플레이볼!', '#f1c40f', 1000, '1회초 · 내가 투수(원태인)', nextPlay);
  updateBoard();
});
</script>
</body>
</html>
